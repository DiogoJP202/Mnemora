# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: mnemora
    runtime: docker
    region: virginia
    plan: free
    branch: main
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://127.0.0.1:5100
      - key: API_BASE_URL
        value: http://127.0.0.1:5100
      - key: MNEMORA_DEMO
        value: "true"
      - key: ConnectionStrings__Default
        value: Data Source=/tmp/mnemora.db
      - key: Mnemora__DataProtectionKeysPath
        value: /tmp/mnemora-keys
