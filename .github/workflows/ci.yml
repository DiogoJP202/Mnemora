name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore and enforce NuGet audit
        run: dotnet restore Mnemora.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Test
        run: dotnet test Mnemora.slnx --configuration Release --no-restore

      - name: Audit NuGet dependencies
        run: dotnet list Mnemora.slnx package --vulnerable --include-transitive

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      API_BASE_URL: http://localhost:5100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test PWA boundaries
        run: node --test ../../tests/pwa/*.test.mjs

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
