name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore and enforce NuGet audit
        run: dotnet restore Mnemora.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Test
        run: dotnet test Mnemora.slnx --configuration Release --no-restore

      - name: Audit NuGet dependencies
        run: dotnet list Mnemora.slnx package --vulnerable --include-transitive

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      API_BASE_URL: http://localhost:5100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test PWA boundaries
        run: node --test ../../tests/pwa/*.test.mjs

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      CI_CONTAINER_NAME: mnemora-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg MNEMORA_DEMO=true --tag mnemora:ci .

      - name: Smoke test container
        run: |
          set -euo pipefail

          show_logs() {
            docker logs "$CI_CONTAINER_NAME" 2>&1 || true
          }
          trap show_logs ERR

          docker run --detach \
            --name "$CI_CONTAINER_NAME" \
            --env 'ConnectionStrings__Default=Data Source=/tmp/mnemora.db' \
            --env Mnemora__DataProtectionKeysPath=/tmp/mnemora-keys \
            --env MNEMORA_DEMO=true \
            --publish 127.0.0.1:3000:3000 \
            mnemora:ci >/dev/null

          for attempt in $(seq 1 120); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:3000/api/health || true)"

            if [ "$status" = "200" ]; then
              echo "Container respondeu /api/health com HTTP 200."
              exit 0
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' "$CI_CONTAINER_NAME" 2>/dev/null || true)" != "true" ]; then
              echo "Container encerrou antes de ficar saudável." >&2
              show_logs
              exit 1
            fi

            sleep 2
          done

          echo "Container não respondeu /api/health com HTTP 200 dentro do prazo." >&2
          show_logs
          exit 1

      - name: Clean up smoke test
        if: always()
        run: |
          docker rm --force "$CI_CONTAINER_NAME" >/dev/null 2>&1 || true
